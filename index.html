<!DOCTYPE html><html><head><title>Incident</title><link rel="stylesheet" href="/static/style.css"><script src="/static/script.js"></script></head><body><div class="box"><h1>Incident Management</h1><p>Implement Client Script and UI Policy (Incident)</p><form method="post" onsubmit="return validateForm()"><label>Caller</label><input id="caller" name="caller"><label>Category</label><select id="category" name="category" onchange="clientScript()"><option value="">Select</option><option>Software</option><option>Hardware</option><option>Network</option></select><label id="plabel">Priority</label><select id="priority" name="priority"><option>1 - Critical</option><option>2 - High</option><option>3 - Moderate</option><option>4 - Low</option></select><label>State</label><select id="state" name="state" onchange="uiPolicy()"><option>New</option><option>In Progress</option><option>Resolved</option><option>Closed</option></select><label id="dlabel">Description</label><textarea id="description" name="description"></textarea><p id="error"></p><button>Create Incident</button></form>{% if msg %}<div class="ok">{{msg}}</div>{% endif %}<h2>Incident Records</h2><table><tr><th>Number</th><th>Caller</th><th>Category</th><th>Priority</th><th>State</th></tr>{% for i in incidents %}<tr><td>{{i.number}}</td><td>{{i.caller}}</td><td>{{i.category}}</td><td>{{i.priority}}</td><td>{{i.state}}</td></tr>{% endfor %}</table><p><a href="/scripts">ServiceNow Scripts</a></p></div></body></html>
